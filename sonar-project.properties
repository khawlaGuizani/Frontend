# SonarCloud configuration for the Frontend (Angular) project.
# In CI these values are also passed as -D args to the sonarqube-scan-action
# (see .github/workflows/ci.yml) which takes precedence; this file lets you
# run `sonar-scanner` locally with the same configuration.


# SonarCloud configuration for the Frontend (Angular) project

sonar.organization=khawlaguizani
sonar.projectKey=khawlaGuizani_Frontend
sonar.projectName=Transport - Frontend
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.angular/**,**/*.spec.ts

# Angular test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
