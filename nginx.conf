server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth alongside backend RASP/CSP policies)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving via a variable (rather than a bare
    # proxy_pass hostname) defers lookup to request time, so nginx still
    # starts even if the "backend" service isn't resolvable yet/at all —
    # e.g. when this image is run standalone (CI image scan) outside
    # docker-compose's network, it returns 502 on /api/ instead of crashing.
    resolver 127.0.0.11 valid=10s;

    # Reverse-proxy API calls to the backend service (see docker-compose.yml)
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA routing: serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
