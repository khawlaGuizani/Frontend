server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth alongside backend RASP/CSP policies)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolving via a variable (rather than a bare proxy_pass hostname)
    # defers lookup to request time, so nginx still starts even if the
    # "backend" host isn't resolvable yet/at all — e.g. when this image is
    # run standalone (CI image scan) outside any orchestrator network, it
    # returns 502 on /api/ instead of crashing.
    #
    # __RESOLVER__ is substituted at container startup (see the image's
    # entrypoint) with whatever nameserver is actually valid in the
    # environment this container is running in — Docker's embedded DNS
    # (127.0.0.11) and Kubernetes' in-cluster DNS (kube-dns/CoreDNS, a
    # different address per cluster) are not the same, so this can't be a
    # fixed value baked into the image.
    resolver __RESOLVER__ valid=10s;

    # Reverse-proxy API calls to the backend service (see docker-compose.yml).
    # proxy_pass's target is a variable (for the deferred-DNS trick above), so
    # nginx's normal "strip the location prefix, append proxy_pass's URI"
    # rewriting does NOT apply here — with a variable, proxy_pass only ever
    # uses its own literal value, dropping everything the client asked for
    # after /api/. $request_uri carries the original, unmodified request URI
    # (path + query string), which is what must be forwarded since the
    # backend's own routes are already prefixed with /api/ too.
    # __BACKEND_HOST__ is substituted at container startup too. nginx's
    # `resolver` directive, unlike a normal libc/wget/nslookup lookup, does
    # NOT apply /etc/resolv.conf's search-domain suffixes — it queries
    # exactly the name given. Docker Compose's embedded DNS resolves the
    # short container name "transport-backend" directly, but Kubernetes'
    # CoreDNS only answers nginx's un-suffixed query for the fully
    # qualified name (transport-backend.<namespace>.svc.cluster.local), so
    # this can't be a single fixed hostname either.
    location /api/ {
        set $backend_upstream http://__BACKEND_HOST__:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA routing: serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
