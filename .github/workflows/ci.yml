name: Frontend CI/DevSecOps

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  FRONTEND_IMAGE: ghcr.io/khawlaguizani/frontend
  K8S_NAMESPACE: transport
  K8S_DEPLOYMENT: transport-frontend
  DAST_TARGET: http://192.168.205.150
  # Générateur des rapports HTML (un rapport par job)
  REPORT: python3 scripts/report_to_html.py

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:

  # ---------------------------------------------------------------------
  # 1. Build, unit tests, SonarCloud static analysis
  # ---------------------------------------------------------------------
  build-test-sonar:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        shell: bash
        env:
          CI: 'true'
        run: npm test 2>&1 | tee test-output.log

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=khawlaguizani
            -Dsonar.projectKey=khawlaGuizani_Frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/transport-frontend/lcov.info

      - name: Skip SonarCloud
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::warning::SONAR_TOKEN secret is not configured."
          echo "SonarCloud analysis skipped."

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: coverage/**
          if-no-files-found: warn
          retention-days: 30

      - name: HTML report — Build & Test (Karma + couverture)
        if: always()
        run: |
          mkdir -p html-report
          $REPORT karma test-output.log html-report/build-test-report.html \
            --lcov coverage/transport-frontend/lcov.info
          [ -f coverage/transport-frontend/index.html ] && cp -r coverage/transport-frontend html-report/coverage || true

      - name: Upload HTML report — Build & Test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-1-build-test
          path: html-report/
          retention-days: 30

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/**
          if-no-files-found: error
          retention-days: 7


  # ---------------------------------------------------------------------
  # 2. Secret scanning — Gitleaks
  # Blocking security control
  # ---------------------------------------------------------------------
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          mkdir -p reports/gitleaks

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --config /repo/security/gitleaks.toml \
            --report-format sarif \
            --report-path /repo/reports/gitleaks/gitleaks.sarif \
            --redact \
            --verbose \
            --exit-code 1

      - name: Generate human-readable Gitleaks report
        if: always()
        run: |
          mkdir -p reports/gitleaks

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --config /repo/security/gitleaks.toml \
            --report-format json \
            --report-path /repo/reports/gitleaks/gitleaks.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('reports/gitleaks/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks/gitleaks.sarif
          category: gitleaks-frontend

      - name: Upload Gitleaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-gitleaks-reports
          path: reports/gitleaks/**
          if-no-files-found: warn
          retention-days: 30

      - name: HTML report — Gitleaks
        if: always()
        run: $REPORT gitleaks reports/gitleaks/gitleaks.json html-report/gitleaks-report.html

      - name: Upload HTML report — Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-2-gitleaks
          path: html-report/
          retention-days: 30


  # ---------------------------------------------------------------------
  # 3. Dependency scanning — npm audit
  # Non-blocking
  # ---------------------------------------------------------------------
  npm-audit:
    name: Dependency Scan (npm audit)
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate npm audit JSON report
        run: |
          mkdir -p reports

          npm audit --json > reports/npm-audit.json || true

      - name: Run npm audit
        run: |
          npm audit || true

      - name: Check critical vulnerabilities
        run: |
          echo "npm audit findings are reported but do not block the pipeline."
          npm audit --audit-level=critical || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: reports/npm-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: HTML report — npm audit
        if: always()
        run: $REPORT npm-audit reports/npm-audit.json html-report/npm-audit-report.html

      - name: Upload HTML report — npm audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-3-npm-audit
          path: html-report/
          retention-days: 30


  # ---------------------------------------------------------------------
  # 4. SAST — Semgrep
  # Non-blocking
  # ---------------------------------------------------------------------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config security/semgrep.yml \
            --config p/typescript \
            --config p/angular \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif \
            --error || true

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-frontend

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-semgrep-report
          path: semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: HTML report — Semgrep
        if: always()
        run: |
          python3 scripts/report_to_html.py sarif semgrep-results.sarif \
            html-report/semgrep-report.html --title "Semgrep — SAST Report (Frontend)"

      - name: Upload HTML report — Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-4-semgrep
          path: html-report/
          retention-days: 30


  # ---------------------------------------------------------------------
  # 5. License compliance scan
  # ---------------------------------------------------------------------
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate license reports
        run: |
          mkdir -p reports

          npx license-checker \
            --production \
            --json \
            > reports/licenses.json

          npx license-checker \
            --production \
            --summary \
            > reports/licenses-summary.txt

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-license-report
          path: |
            reports/licenses.json
            reports/licenses-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: HTML report — Licenses
        if: always()
        run: $REPORT license-checker reports/licenses.json html-report/license-report.html

      - name: Upload HTML report — Licenses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-5-licenses
          path: html-report/
          retention-days: 30


  # ---------------------------------------------------------------------
  # 6. Docker image build + Trivy + Syft + Grype
  # Non-blocking security analysis
  # ---------------------------------------------------------------------
  docker-image-security:
    name: Docker Build & Image Security
    runs-on: ubuntu-latest

    needs:
      - build-test-sonar
      - gitleaks

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Docker image name
        id: image-name
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------------------------------
      # Trivy
      # ---------------------------------------------------------------

      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            trivy-${{ runner.os }}-
            trivy-

      - name: Trivy scan — SARIF
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'
          timeout: 30m

      - name: Download Trivy HTML template
        run: |
          mkdir -p contrib

          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o contrib/html.tpl

      - name: Trivy scan — HTML report
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          format: template
          template: '@contrib/html.tpl'
          output: trivy-report.html
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          timeout: 30m

      - name: Trivy critical scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          timeout: 30m

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-frontend-image


      # ---------------------------------------------------------------
      # Syft — SBOM
      # ---------------------------------------------------------------

      - name: Generate SBOM with Syft
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image-name.outputs.name}}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-frontend.cyclonedx.json


      # ---------------------------------------------------------------
      # Grype — SBOM vulnerability scan
      # ---------------------------------------------------------------

      - name: Scan SBOM with Grype
        id: grype
        continue-on-error: true
        uses: anchore/scan-action@v6
        with:
          sbom: sbom-frontend.cyclonedx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-frontend-sbom


      # ---------------------------------------------------------------
      # Upload all container security reports
      # ---------------------------------------------------------------

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-container-security-reports
          path: |
            trivy-results.sarif
            trivy-report.html
            sbom-frontend.cyclonedx.json
            ${{ steps.grype.outputs.sarif }}
          if-no-files-found: warn
          retention-days: 30

      - name: HTML report — Image security
        if: always()
        run: |
          mkdir -p html-report
          cp trivy-report.html html-report/trivy-report.html 2>/dev/null || true
          $REPORT cyclonedx sbom-frontend.cyclonedx.json html-report/sbom-report.html
          $REPORT sarif "${{ steps.grype.outputs.sarif }}" html-report/grype-report.html \
            --title "Grype — Image Vulnerability Report (Frontend)"

      - name: Upload HTML report — Image security
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-6-image-security
          path: html-report/
          retention-days: 30


      # ---------------------------------------------------------------
      # GHCR
      # ---------------------------------------------------------------

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.name }}:${{ github.sha }}
            ${{ steps.image-name.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ---------------------------------------------------------------------
  # 7. Consolidated Security Gate
  # ---------------------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    if: always()

    needs:
      - build-test-sonar
      - gitleaks
      - npm-audit
      - semgrep
      - license-scan
      - docker-image-security

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: HTML report — Security Gate
        if: always()
        run: |
          $REPORT gate - html-report/security-gate-report.html \
            --title "Security Gate Report (Frontend)" \
            --blocking "Build & Test;Gitleaks" \
            --results "Build & Test=${{ needs.build-test-sonar.result }},Gitleaks=${{ needs.gitleaks.result }},npm audit=${{ needs.npm-audit.result }},Semgrep=${{ needs.semgrep.result }},License Scan=${{ needs.license-scan.result }},Docker Image Security=${{ needs.docker-image-security.result }}"

      - name: Upload HTML report — Security Gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-7-security-gate
          path: html-report/
          retention-days: 30

      - name: Evaluate security gate
        run: |
          echo "========================================="
          echo "        FRONTEND SECURITY GATE"
          echo "========================================="

          echo "build-test-sonar:     ${{ needs.build-test-sonar.result }}"
          echo "gitleaks:             ${{ needs.gitleaks.result }}"
          echo "npm-audit:            ${{ needs.npm-audit.result }}"
          echo "semgrep:              ${{ needs.semgrep.result }}"
          echo "license-scan:         ${{ needs.license-scan.result }}"
          echo "docker-security:      ${{ needs.docker-image-security.result }}"

          echo "========================================="

          if [ "${{ needs.build-test-sonar.result }}" != "success" ]; then
            echo "::error::Build/Test/Sonar job failed."
            exit 1
          fi

          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "::error::Gitleaks detected a blocking issue."
            exit 1
          fi

          echo "Security Gate passed."
          echo "Security analysis reports are available as artifacts."


  # ---------------------------------------------------------------------
  # 8. Deploy Frontend to K3s
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy Frontend to K3s
    runs-on: self-hosted

    needs:
      - security-gate

    if: >
      needs.security-gate.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        run: |
          echo "Checking Kubernetes cluster..."

          kubectl cluster-info

          echo "Current nodes:"
          kubectl get nodes

          echo "Transport namespace:"
          kubectl get pods -n transport

      - name: Restart frontend deployment
        run: |
          kubectl rollout restart deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status \
            deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Verify frontend pod
        run: |
          echo "Frontend deployment:"
          kubectl get deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }}

          echo "Frontend pods:"
          kubectl get pods \
            -n ${{ env.K8S_NAMESPACE }} \
            -l app=transport-frontend \
            -o wide

      - name: Verify frontend service
        run: |
          kubectl get svc \
            -n ${{ env.K8S_NAMESPACE }} \
            transport-frontend

      - name: Deployment completed
        run: |
          echo "========================================="
          echo " Frontend deployed successfully onK3s "
          echo "========================================="

      - name: HTML report — Deploy K3s
        if: always()
        run: |
          {
            echo "=== Rollout ${{ env.K8S_DEPLOYMENT }} ==="
            kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=10s
            echo; echo "=== Historique ==="
            kubectl rollout history deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}
            echo; echo "=== Pods / Services ==="
            kubectl get deploy,pods,svc -n ${{ env.K8S_NAMESPACE }} -o wide
          } > deploy.log 2>&1 || true
          $REPORT text deploy.log html-report/deploy-report.html --title "Deploy Frontend to K3s Report"

      - name: Upload HTML report — Deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-8-deploy
          path: html-report/
          retention-days: 30


  # ---------------------------------------------------------------------
  # 9. DAST — OWASP ZAP
  # ---------------------------------------------------------------------
  dast:
    name: DAST — OWASP ZAP
    runs-on: self-hosted

    needs:
      - deploy

    if: >
      needs.deploy.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    continue-on-error: true

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ZAP reports directory
        run: |
          mkdir -p zap-reports

      - name: Verify frontend endpoint
        run: |
          echo "Testing frontend target: ${{ env.DAST_TARGET }}"

          curl -I \
            --max-time 30 \
            "${{ env.DAST_TARGET }}" || true

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ env.DAST_TARGET }}" \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            || true

      - name: List ZAP reports
        if: always()
        run: |
          echo "Generated ZAP reports:"
          ls -lah zap-reports/

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dast-zap-reports
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 100

      - name: Upload HTML report — ZAP
        if: always() && hashFiles('zap-reports/zap-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: html-report-9-dast-zap
          path: zap-reports/zap-report.html
          retention-days: 100

      - name: DAST completed
        if: always()
        run: |
          echo "========================================="
          echo " OWASP ZAP DAST scan completed "
          echo " Reports uploaded as artifacts "
          echo "========================================="


  # ---------------------------------------------------------------------
  # 10. Rapport global — tous les rapports HTML + index.html
  # ---------------------------------------------------------------------
  pipeline-reports:
    name: Pipeline HTML Reports
    runs-on: ubuntu-latest

    if: always()

    needs:
      - build-test-sonar
      - gitleaks
      - npm-audit
      - semgrep
      - license-scan
      - docker-image-security
      - security-gate
      - deploy
      - dast

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all HTML reports
        uses: actions/download-artifact@v4
        with:
          pattern: html-report-*
          path: pipeline-reports/

      - name: Build index.html
        run: |
          $REPORT index pipeline-reports pipeline-reports/index.html \
            --title "TransitFlow Frontend — Rapports de la pipeline #${{ github.run_number }}"

      - name: Upload all HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-html-reports
          path: pipeline-reports/
          retention-days: 100
