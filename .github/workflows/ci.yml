name: Frontend CI/DevSecOps

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/frontend

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # 1. Build, unit tests, SonarCloud static analysis
  # ---------------------------------------------------------------------
  build-test-sonar:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run unit tests with coverage
        env:
          CI: 'true'
        run: npm test

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=khawlaguizani
            -Dsonar.projectKey=khawlaGuizani_Frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Skip SonarCloud (SONAR_TOKEN not configured)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN secret is not set — skipping SonarCloud analysis. See README-DEVSECOPS.md."

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: coverage/**
          retention-days: 30

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/**
          retention-days: 7

  # ---------------------------------------------------------------------
  # 2. Secret scanning — Gitleaks (blocking)
  # ---------------------------------------------------------------------
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          mkdir -p reports/gitleaks
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/security/gitleaks.toml \
            --report-format sarif --report-path /repo/reports/gitleaks/gitleaks.sarif \
            --redact --verbose --exit-code 1

      - name: Generate human-readable Gitleaks report
        if: always()
        run: |
          mkdir -p reports/gitleaks
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/security/gitleaks.toml \
            --report-format json --report-path /repo/reports/gitleaks/gitleaks.json \
            --redact --exit-code 0

      - name: Upload Gitleaks SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks/gitleaks.sarif
          category: gitleaks

      - name: Upload Gitleaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: reports/gitleaks/**
          retention-days: 30

  # ---------------------------------------------------------------------
  # 3. Dependency scanning — npm audit
  # ---------------------------------------------------------------------
  npm-audit:
    name: Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run npm audit (report)
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          npm audit || true

      - name: Fail on CRITICAL vulnerabilities
        run: npm audit --audit-level=critical

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: reports/npm-audit.json
          retention-days: 30

  # ---------------------------------------------------------------------
  # 4. SAST — Semgrep
  # ---------------------------------------------------------------------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config security/semgrep.yml \
            --config p/typescript \
            --config p/angular \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif --output semgrep-results.sarif \
            --error || true

      - name: Upload Semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-semgrep-report
          path: semgrep-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------
  # 5. License compliance scan
  # ---------------------------------------------------------------------
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Generate license report
        run: |
          mkdir -p reports
          npx license-checker --production --json > reports/licenses.json
          npx license-checker --production --summary > reports/licenses-summary.txt

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-license-report
          path: reports/licenses*
          retention-days: 30

  # ---------------------------------------------------------------------
  # 6. Docker image build, Trivy scan, SBOM (Syft), SBOM scan (Grype)
  # ---------------------------------------------------------------------
  docker-image-security:
    name: Docker Build & Image Security (Trivy/Syft/Grype)
    runs-on: ubuntu-latest
    needs: [build-test-sonar, gitleaks]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — SARIF (for code scanning)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'

      - name: Trivy scan — HTML report
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-report.html
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Trivy scan — fail on CRITICAL with a fix available
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-frontend-image

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-frontend.cyclonedx.json

      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@v6
        id: grype
        with:
          sbom: sbom-frontend.cyclonedx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-frontend-sbom

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-container-security-reports
          path: |
            trivy-results.sarif
            trivy-report.html
            sbom-frontend.cyclonedx.json
            ${{ steps.grype.outputs.sarif }}
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 7. Consolidated security gate
  # ---------------------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-test-sonar
      - gitleaks
      - npm-audit
      - semgrep
      - license-scan
      - docker-image-security
    steps:
      - name: Evaluate gate
        run: |
          echo "build-test-sonar:      ${{ needs.build-test-sonar.result }}"
          echo "gitleaks:               ${{ needs.gitleaks.result }}"
          echo "npm-audit:              ${{ needs.npm-audit.result }}"
          echo "semgrep:                ${{ needs.semgrep.result }}"
          echo "license-scan:           ${{ needs.license-scan.result }}"
          echo "docker-image-security:  ${{ needs.docker-image-security.result }}"
          if [ "${{ needs.build-test-sonar.result }}" != "success" ] || [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "::error::Security gate failed — build/tests or secret scanning did not pass."
            exit 1
          fi
          echo "Security gate passed."

      - name: Trigger deployment
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/devsecops-platform/dispatches" \
            -d '{"event_type":"security-gate-passed"}'
